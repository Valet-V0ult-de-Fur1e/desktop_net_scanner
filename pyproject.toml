[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internetmetr"
version = "0.1.0"
description = "Desktop internet meter built with PyQt6 and clean architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.7.0",
    "psutil>=5.9.8",
    "requests>=2.32.0",
    "speedtest-cli>=2.1.3"
]

[project.scripts]
internetmetr = "internetmetr.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["internetmetr*"]
